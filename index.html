<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Migul Lite">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Migul Lite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Video -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="assets/l4oaly.mp4" type="video/mp4">
    </video>
    
    <!-- Crosshair (Open Line Aim) -->
    <div id="crosshair-container" class="hidden">
        <div class="crosshair-circle"></div>
        <div class="crosshair-inner"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden">chào mừng bạn đến với migul lite by pô mod</div>

    <!-- Floating Menu Overlay -->
    <div id="menu-overlay" class="glass-panel">
        <!-- Header -->
        <div class="header">
            <div class="title-container">
                <span class="title">MIGUL LITE</span>
                <span class="version">v1.0</span>
            </div>
            <div class="window-controls">
                <button class="control-btn" id="btn-minimize">—</button>
                <button class="control-btn" id="btn-close">✕</button>
            </div>
        </div>
        
        <hr class="divider">
        
        <!-- Device Info -->
        <div class="device-panel">
            <div class="device-name">Apple Web App Environment</div>
            <div class="device-stats">
                <span>RAM: Optimized</span>
                <span>BAT: 100%</span>
                <span class="fps-text" id="fps-display">FPS: 60</span>
            </div>
        </div>
        
        <!-- Features List -->
        <div class="features-list">
            <!-- Item 1 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Aimlock Engine</span>
                    <span class="feature-desc">Tinh Chỉnh Lock Vùng Đầu</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_aimlock">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            
            <!-- Item 2 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Performance Engine</span>
                    <span class="feature-desc">Tăng Hiệu Năng Hệ Thống</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_performance">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            
            <!-- Item 3 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">FPS Booster</span>
                    <span class="feature-desc">Ổn Định Tốc Độ Khung Hình</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_fps">
                    <span class="toggle-slider"></span>
                </div>
            </label>

            <!-- Item 4 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Network Optimizer</span>
                    <span class="feature-desc">Tối Ưu Kết Nối Mạng</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_network">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            
            <!-- Item 5 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Touch Response</span>
                    <span class="feature-desc">Tăng Độ Nhạy Thao Tác Cảm Ứng</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_touch">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            
            <!-- Item 6 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Open Line Aim</span>
                    <span class="feature-desc">Mở Vòng Tròn Ngoại Tâm</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_open_line_aim">
                    <span class="toggle-slider"></span>
                </div>
            </label>

            <!-- Item 7 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Smart Sensitivity</span>
                    <span class="feature-desc">Tinh Chỉnh Độ Nhạy Thiết Bị</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_smart_sens">
                    <span class="toggle-slider"></span>
                </div>
            </label>
            
            <!-- Item 8 -->
            <label class="feature-item">
                <div class="feature-info">
                    <span class="feature-name">Graphics Control</span>
                    <span class="feature-desc">Tối Ưu Hiển Thị Đồ Họa</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" class="cyber-toggle" id="cb_graphics">
                    <span class="toggle-slider"></span>
                </div>
            </label>
        </div>
        
        <button id="btn_activate" class="btn-cyber-default">ACTIVATE</button>
    </div>

    <!-- Minimized Icon -->
    <div id="minimized-icon" class="hidden">
        <img src="assets/oke124141.png" alt="Migul Icon">
    </div>

    <script src="script.js"></script>
</body>
</html>
